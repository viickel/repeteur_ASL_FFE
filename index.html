<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <link rel="stylesheet" type="text/css" href="style.css">
    <title>RÉPÉTEUR ESCRIME ASL-FFE</title>
    <!-- PeerJS CDN -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
</head>
<body>

<div class="main-content">
    <div class="content">

        <!-- SCORES + CARTONS -->
        <div class="score-container">
            <div class="score-side">
                <div class="score score_red" id="left_score">0</div>
                <div class="card-count-row">
                    <div class="card-counter"><span class="card-display card-white"  id="left_card_white">0</span></div>
                    <div class="card-counter"><span class="card-display card-yellow" id="left_card_yellow">0</span></div>
                    <div class="card-counter"><span class="card-display card-red"    id="left_card_red">0</span></div>
                    <div class="card-counter"><span class="card-display card-black"  id="left_card_black">0</span></div>
                </div>
            </div>
            <div class="score-side">
                <div class="score score_green" id="right_score">0</div>
                <div class="card-count-row">
                    <div class="card-counter"><span class="card-display card-white"  id="right_card_white">0</span></div>
                    <div class="card-counter"><span class="card-display card-yellow" id="right_card_yellow">0</span></div>
                    <div class="card-counter"><span class="card-display card-red"    id="right_card_red">0</span></div>
                    <div class="card-counter"><span class="card-display card-black"  id="right_card_black">0</span></div>
                </div>
            </div>
        </div>

        <!-- BOUTONS POINTS -->
        <div class="score-control-container">
            <div class="score-side">
                <div class="button-row">
                    <button class="point-btn point-btn-a" data-player="left"  data-points="1">Zone A<br>(+1)</button>
                    <button class="point-btn point-btn-b" data-player="left"  data-points="3">Zone B<br>(+3)</button>
                    <button class="point-btn point-btn-c" data-player="left"  data-points="5">Zone C<br>(+5)</button>
                </div>
            </div>
            <div class="score-side">
                <div class="button-row">
                    <button class="point-btn point-btn-a" data-player="right" data-points="1">Zone A<br>(+1)</button>
                    <button class="point-btn point-btn-b" data-player="right" data-points="3">Zone B<br>(+3)</button>
                    <button class="point-btn point-btn-c" data-player="right" data-points="5">Zone C<br>(+5)</button>
                </div>
            </div>
        </div>

        <!-- CHRONO -->
        <div class="chrono-container">
            <div id="matchChrono" class="timer-display">03:00</div>
            <div id="chronoControls" class="button-row force-hide">
                <button id="customTimeBtn"  class="timer-button">⏱ RÉGLER TEMPS</button>
                <button id="quickTimer30s"  class="timer-button">30 SEC</button>
                <button id="medicalBreakBtn" class="timer-button">⚕ PAUSE MED</button>
                <button id="castBtn" class="timer-button cast-btn"><span id="castStatus">📺 CAST TV</span></button>
            </div>
        </div>

        <!-- FAUTES -->
        <div class="card-penalty-wrapper">
            <div class="fault-controls">
                <div class="score-side">
                    <div class="button-row fault-row-container">
                        <button class="fault-btn card-button card-white"  data-player="left"  data-group="1">Faute Grp 1</button>
                        <button class="fault-btn card-button card-yellow" data-player="left"  data-group="2">Faute Grp 2</button>
                        <button class="fault-btn card-button card-red"    data-player="left"  data-group="3">Faute Grp 3</button>
                        <button class="fault-btn card-button card-black"  data-player="left"  data-group="4">Faute Grp 4</button>
                    </div>
                </div>
                <div class="score-side">
                    <div class="button-row fault-row-container">
                        <button class="fault-btn card-button card-white"  data-player="right" data-group="1">Faute Grp 1</button>
                        <button class="fault-btn card-button card-yellow" data-player="right" data-group="2">Faute Grp 2</button>
                        <button class="fault-btn card-button card-red"    data-player="right" data-group="3">Faute Grp 3</button>
                        <button class="fault-btn card-button card-black"  data-player="right" data-group="4">Faute Grp 4</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- ANNULER -->
        <div class="card-buttons">
            <button id="undoBtn" class="card-button undo-btn">↩ Annuler dernière action</button>
        </div>

    </div><!-- /content -->

    <!-- START / RESET -->
    <div class="button-row">
        <button id="resetBtn"        class="startStopButton" style="display:none; background-color:#ff004c; box-shadow:0 0 15px #ff004c;">RÉINITIALISER</button>
        <button id="startStopButton" class="startStopButton" style="background-color:green;">START</button>
    </div>

</div><!-- /main-content -->

<!-- PAUSE MÉDICALE -->
<div id="medicalOverlay" class="hidden">
    <div id="medicalModal">
        <h1>⚕ PAUSE MÉDICALE</h1>
        <div id="medicalChrono">05:00</div>
        <button id="closeMedicalBtn">Reprendre le match</button>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
